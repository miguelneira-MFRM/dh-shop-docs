<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matcher Knowledge Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #f4f3ee;
        --bg-secondary: #eeede6;
        --bg-tertiary: #e8e6dc;
        --bg-inverse: #191817;
        --text-primary: #191817;
        --text-secondary: #5a554e;
        --text-muted: #8a847a;
        --accent: #c96442;
        --accent-hover: #b55738;
        --accent-soft: #e89268;
        --border: #d8d3c8;
        --border-strong: #c4bfb2;
        --success: #6b7a3d;
        --warning: #c98a42;
        --danger: #a53e2a;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          sans-serif;
        --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font: 400 17px/1.6 var(--sans);
        color: var(--text-primary);
        background: var(--bg-primary);
        text-wrap: pretty;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 64px 48px 96px;
      }

      .masthead {
        border-bottom: 1px solid var(--border);
        padding-bottom: 48px;
        margin-bottom: 56px;
      }
      .eyebrow {
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 24px;
      }
      .title {
        font: 600 50px/1.1 var(--sans);
        letter-spacing: -0.02em;
        margin: 0 0 20px;
        text-wrap: balance;
      }
      .deck {
        font: 400 italic 21px/1.45 var(--sans);
        color: var(--text-secondary);
        max-width: 680px;
        margin: 0 0 40px;
        text-wrap: pretty;
      }
      .byline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      .byline-item {
        font-size: 14px;
        color: var(--text-secondary);
      }
      .byline-item strong {
        display: block;
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 64px;
        align-items: start;
      }
      .toc {
        position: sticky;
        top: 32px;
      }
      .toc-label {
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 16px;
      }
      .toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: toc;
      }
      .toc li {
        counter-increment: toc;
        margin: 0 0 10px;
        font-size: 14px;
      }
      .toc li::before {
        content: counter(toc, decimal-leading-zero);
        font: 500 11px/1 var(--mono);
        color: var(--accent);
        margin-right: 10px;
      }
      .toc a {
        color: var(--text-primary);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      .toc a:hover {
        border-bottom-color: var(--accent);
      }

      article {
        min-width: 0;
        max-width: 760px;
      }
      .article-intro {
        font: 400 italic 19px/1.5 var(--sans);
        color: var(--text-secondary);
        margin: 0 0 56px;
        max-width: 640px;
      }
      article > section {
        margin-bottom: 80px;
        scroll-margin-top: 32px;
      }
      article h2 {
        font: 600 32px/1.2 var(--sans);
        letter-spacing: -0.015em;
        margin: 0 0 24px;
        text-wrap: balance;
      }
      article h3 {
        font: 600 21px/1.3 var(--sans);
        letter-spacing: -0.01em;
        margin: 40px 0 14px;
      }
      article h4 {
        font: 500 13px/1.4 var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin: 28px 0 12px;
      }
      article p {
        margin: 0 0 18px;
      }
      .section-num {
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        display: block;
        margin-bottom: 10px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      a:hover {
        border-bottom-color: var(--accent);
      }
      strong {
        font-weight: 600;
      }

      code {
        font: 500 0.92em var(--mono);
        background: var(--bg-secondary);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--text-primary);
      }

      pre {
        margin: 0 0 24px;
        padding: 20px 24px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow-x: auto;
      }
      pre code {
        font: 400 14px/1.6 var(--mono);
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
        white-space: pre;
      }

      blockquote {
        font: 400 italic 19px/1.5 var(--sans);
        border-left: 3px solid var(--accent);
        padding-left: 22px;
        margin: 24px 0 28px;
        color: var(--text-secondary);
        max-width: 640px;
      }
      blockquote p {
        margin: 0;
      }

      ol,
      ul {
        padding-left: 22px;
        margin: 0 0 22px;
      }
      ol li,
      ul li {
        margin-bottom: 8px;
      }
      li::marker {
        color: var(--accent);
      }

      .table-wrap {
        margin: 0 0 28px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      thead th {
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        text-align: left;
        padding: 14px 18px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
      }
      tbody td {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:nth-child(even) td {
        background: var(--bg-secondary);
      }
      tbody td code {
        font-size: 13px;
      }

      footer {
        margin-top: 96px;
        padding-top: 32px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      footer strong {
        color: var(--text-secondary);
        font-weight: 500;
      }

      @media (max-width: 900px) {
        .page {
          padding: 40px 24px 64px;
        }
        .title {
          font-size: 36px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .toc {
          position: static;
        }
        .byline {
          grid-template-columns: 1fr 1fr;
        }
        article {
          max-width: none;
        }
        body {
          font-size: 18px;
        }
      }
      @media (max-width: 640px) {
        .byline {
          grid-template-columns: 1fr;
        }
        .title {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="eyebrow">DreamHub · Knowledge hub</p>
        <h1 class="title">Matcher Knowledge Hub</h1>
      </header>

      <div class="layout">
        <nav class="toc">
          <p class="toc-label">Contents</p>
          <ol>
            <li>
              <a
                href="https://miguelneira-mfrm.github.io/dh-shop-docs/README.html"
                >README</a
              >
            </li>
            <li>
              <a
                href="https://miguelneira-mfrm.github.io/dh-shop-docs/matcher-app-overview.html"
                >App Overview</a
              >
            </li>
            <li>
              <a
                href="https://miguelneira-mfrm.github.io/dh-shop-docs/matcher-api-triggers.html"
                >API Triggers</a
              >
            </li>
                        <li>
              <a
                href="https://miguelneira-mfrm.github.io/dh-shop-docs/matcher-matches-api-overview.html"
                >API Overview</a
              >
            </li>
          </ol>
        </nav>
      </div>
    </div>
  </body>
</html>
